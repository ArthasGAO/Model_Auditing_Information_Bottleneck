Scenario_Name: CIFAR-10_ResNet-18

Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
      - {name: RandomCrop, params: {size: 32, padding: 4}}
      - {name: RandomHorizontalFlip, params: {p: 0.5}}
      - {name: ToTensor}
      - {name: Normalize}
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000