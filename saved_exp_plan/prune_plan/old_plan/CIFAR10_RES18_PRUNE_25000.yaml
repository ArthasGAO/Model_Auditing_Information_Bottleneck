# ======================================================
# Experiment Configuration: CIFAR-10 + ResNet-18 (SGD + Cosine LR) + restoring fine-tuning (optional)
# ======================================================
Model_Name: CIFAR-10_ResNet-18_25000 # this is used to load the trained model
Scenario_Name: CIFAR-10_ResNet-18_25000_Same_25000

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000 #this represents the data size used for training

FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000 #this represents the data size used for fine_tuning
  note: same

Model: ResNet-18

Optimizers:
  - name: SGD
    sparsity: 0.2
    params:
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
    Epochs: 20

  - name: SGD
    sparsity: 0.4
    params:
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
    Epochs: 30

  - name: SGD
    sparsity: 0.6
    params:
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
    Epochs: 50

  - name: SGD
    sparsity: 0.8
    params:
      lr: 0.005
      momentum: 0.9
      weight_decay: 0.0005
      nesterov: true
    Epochs: 80


Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto # <-- dynamic: same as the epochs set for this strategy
    eta_min: 0.000001

BatchSize: 128
