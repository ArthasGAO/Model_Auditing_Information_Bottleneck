# ======================================================
# Experiment Configuration: CIFAR-100 + ResNet-18 + Pruning + Restoring FT (Same distribution)
# ======================================================
Model_Name: CIFAR-100_ResNet-18_25000
Scenario_Name: CIFAR-100_ResNet-18_25000_Same_25000

Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

FT_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000
  note: same
  # group_A is 25000 of 50000, so group_B at overlap 0.0 is exactly the disjoint
  # complement -- this is the maximum-data attacker, no slack left in the pool.
  # ft_data_val here is the real CIFAR-100 test set (determine_ft_dataset else-branch),
  # so Test_Acc below IS true test accuracy, and best_epoch.pth is selected on it.

Model: ResNet-18

# ------------------------------------------------------------------
# Per-sparsity configs.
#
# Sparsity levels: 0.2 and 0.8 only (time-boxed to two rates).
#   Measured pre-FT accuracy at ftsize=10000, victim = 72.24:
#     0.2 -> 72.13 (-0.11)   0.4 -> 72.08 (-0.16)
#     0.6 -> 71.80 (-0.44)   0.8 -> 69.01 (-3.23)
#   0.2/0.4/0.6 are all inside seed noise, so 0.6 would be a near-duplicate of 0.2.
#   0.8 is the only level that materially changes the function -> keep the span.
#
# Optimizer: matched EXACTLY to the FT-AL arm of CIFAR100_RES18_FT_25000.yaml
# (SGD 1e-4 / mom 0.9 / wd 2e-4 / nesterov / 50 ep). Previously this plan ran
# lr 1e-3 -- 10x the FT baseline -- which confounds "pruning removed the signal"
# with "a 10x more aggressive fine-tune removed the signal". With the recipes
# aligned, the only variable between the FT experiment and this one is the pruning.
#
# That old lr 1e-3 / 20 ep setting was also net-destructive at ftsize=10000:
# 72.13 -> 68.12 at s=0.2, i.e. the "restoring" FT cost 4 points. At 1e-4 with
# 2.5x the FT data it should stay flat instead of drifting.
#
# Epochs held equal across sparsities on purpose: unequal FT budgets would make
# any MI difference between 0.2 and 0.8 partly an epoch effect.
# ------------------------------------------------------------------
Optimizers:
  - name: SGD
    sparsity: 0.2
    params:
      lr: 0.0001
      momentum: 0.9
      weight_decay: 0.0002
      nesterov: true
    Epochs: 50

  - name: SGD
    sparsity: 0.8
    params:
      lr: 0.0001
      momentum: 0.9
      weight_decay: 0.0002
      nesterov: true
    Epochs: 50

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.000001

# NOTE: not read by main_prune.py -- both DataLoaders hardcode batch_size=128.
# Kept for documentation only; the value agrees with what the code actually uses.
BatchSize: 128
