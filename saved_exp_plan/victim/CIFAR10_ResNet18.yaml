Scenario_Name: CIFAR-10_ResNet-18_25000

Dataset:
  name: CIFAR-10
  root_dir: ./data                # torchvision download dir (override with --data-root)
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000               # |group_A|, the victim's training-set size

Model: ResNet-18

Optimizer:
  name: SGD
  params: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005, nesterov: true}

Scheduler:
  name: CosineAnnealingLR
  params: {T_max: auto, eta_min: 1.0e-06}     # auto -> Epochs (one scheduler step per epoch)

Epochs: 160
