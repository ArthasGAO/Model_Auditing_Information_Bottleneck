# ======================================================
# ABLATION: RemovalNet with LOGIT-LEVEL removal ONLY (decision-boundary).
# Sets RemovalNet.logit_only=true -> feature_maximize / fed_forward are skipped
# entirely, so the attack never touches intermediate layers (no white-box layer
# similarity removal). Objective: loss = alpha*loss_kl + gamma*loss_ce.
# `layer` is ignored in this mode.
# ======================================================
Model_Name: CIFAR-10_ResNet-18_25000
Scenario_Name: CIFAR-10_ResNet-18_25000_RemovalNet

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 10000

Model: ResNet-18

RemovalNet:
  logit_only: true    # <-- the ablation switch
  layer: 2            # ignored when logit_only=true
  ydist: l2
  alpha: 0.8          # weight on logit-level KL removal  (consider raising, e.g. 0.5-1.0,
                      #   since the dominant beta/layer term is removed in this mode)
  beta: 2.0           # ignored when logit_only=true
  gamma: 0.2          # weight on accuracy-preserving CE
  T: 20
  poison_steps: 20    # ignored when logit_only=true (no feature_maximize)
  shuffle_ratio: 0.02 # ignored when logit_only=true
  lr: 0.008
  momentum: 0.9
  weight_decay: 0.0001
  iterations: 500
  test_interval: 20
  save_interval: 100
  batch_size: 128
