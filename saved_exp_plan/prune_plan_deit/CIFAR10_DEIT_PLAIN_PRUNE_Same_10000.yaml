# ======================================================
# Experiment Configuration: CIFAR-10 + DeiT-Tiny (plain) + Pruning + Restoring FT
# Same-distribution FT set (group_B, 10000, disjoint from group_A).
#
# Dataset / Model blocks are copied verbatim from
#   saved_exp_plan/ft_plan/old_plan/CIFAR10_DeiT_Plain_FT_Same_10000.yaml
# so the model built here matches saved_models/vanilla/Transformer_Models/
#   CIFAR-10_DeiT_Plain_25000_42_1.0/best_epoch.pth
#
# Driven by main_prune_deit (RUN_DEIT=1). patch_embed is excluded from pruning.
# ======================================================
Model_Name: CIFAR-10_DeiT_Plain_25000        # this is used to load the trained model
Scenario_Name: CIFAR-10_DeiT_Plain_25000_Same_10000

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 7}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.15, scale: [0.02, 0.25], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 7}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.15, scale: [0.02, 0.25], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 10000
  note: same

Model:
  model_name: deit_tiny_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: False
  drop_path_rate: 0.1

# Per-sparsity configs. Only FT-AL is used for pruning (see STRATEGY in main_prune.py).
# LR follows the FT-AL entry of the DeiT-plain FT plan (AdamW 1e-4 / wd 0.03) --
# ViT recovery is far more LR-sensitive than the CNN plan's SGD 1e-3.
# Epochs held flat at 20 to match the CNN prune plan; raise for 0.6 / 0.8 if the
# pre-FT accuracy drop turns out not to recover.
Optimizers:
  - name: AdamW
    sparsity: 0.2
    params:
      lr: 0.0001
      weight_decay: 0.03
    Epochs: 20

  - name: AdamW
    sparsity: 0.4
    params:
      lr: 0.0001
      weight_decay: 0.03
    Epochs: 20

  - name: AdamW
    sparsity: 0.6
    params:
      lr: 0.0001
      weight_decay: 0.03
    Epochs: 20

  - name: AdamW
    sparsity: 0.8
    params:
      lr: 0.0001
      weight_decay: 0.03
    Epochs: 20

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto      # <-- dynamic: same as the epochs set for this sparsity
    eta_min: 0.000001

BatchSize: 128
