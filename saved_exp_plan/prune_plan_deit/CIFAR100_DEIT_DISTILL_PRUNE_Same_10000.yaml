# ======================================================
# Experiment Configuration: CIFAR-100 + DeiT-Tiny (distilled) + Pruning + Restoring FT
# Same-distribution FT set (group_B, 10000, disjoint from group_A).
#
# Dataset block is copied from saved_exp_plan/train_plan/CIFAR100_DeiT_Distill_SMALL.yaml
# and the Model block names the distilled arch, so the model built here matches
#   saved_models/vanilla/Transformer_Models/CIFAR-100_DeiT_Distill_25000_42_1.0/best_epoch.pth
# NOTE: as of 2026-09-19 only the _0.0 (negative-pool) DeiT-Distill models exist;
# the _42_1.0 victim is still to be trained.
#
# Driven by main_prune_deit (RUN_DEIT=1).
# This arch has TWO heads (head + head_dist) -- both are pruned, and eval takes
# (head + head_dist)/2 via evaluate_deit_ft, matching timm's inference behaviour.
# patch_embed is excluded from pruning.
# ======================================================
Model_Name: CIFAR-100_DeiT_Distill_25000     # this is used to load the trained model
Scenario_Name: CIFAR-100_DeiT_Distill_25000_Same_10000

Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 9}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.20, scale: [0.02, 0.20], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

FT_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 9}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.20, scale: [0.02, 0.20], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 10000
  note: same

Model:
  model_name: deit_tiny_distilled_patch16_224   # forced by the distillation head
  img_size: 32
  patch_size: 4
  pretrained: False
  drop_path_rate: 0.15

# Per-sparsity configs. Only FT-AL is used for pruning (see STRATEGY in main_prune.py).
# LR follows the FT-AL entry of the CIFAR-100 DeiT FT plan (AdamW 1.5e-4 / wd 0.05).
# Epochs held flat at 20 to match the CNN prune plan; CIFAR-100 recovery is harder,
# so raise 0.6 / 0.8 if the post-FT accuracy has not plateaued.
Optimizers:
  - name: AdamW
    sparsity: 0.2
    params:
      lr: 0.00015
      weight_decay: 0.05
    Epochs: 20

  - name: AdamW
    sparsity: 0.4
    params:
      lr: 0.00015
      weight_decay: 0.05
    Epochs: 20

  - name: AdamW
    sparsity: 0.6
    params:
      lr: 0.00015
      weight_decay: 0.05
    Epochs: 20

  - name: AdamW
    sparsity: 0.8
    params:
      lr: 0.00015
      weight_decay: 0.05
    Epochs: 20

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto      # <-- dynamic: same as the epochs set for this sparsity
    eta_min: 0.000001

BatchSize: 128
