# ======================================================================
# CIFAR-100 pruning at sparsity 0.6 -- CIFAR-100_ResNet-18_25000
#   derived by saved_exp_plan/make_c100_prune_s06.py from
#   saved_exp_plan/prune_plan_c100/CIFAR100_RES18_PRUNE_Same_25000.yaml
#   ONLY the sparsity differs. Optimizer, epochs, scheduler, dataset,
#   transforms and Scenario_Name are copied verbatim from that plan, so the
#   only variable between this cell and the 0.2 cell is the sparsity.
#
#   SGD lr=0.0001 x 50 ep, FT-AL
#   driver : main_prune
#
# Single level on purpose. main_prune.py's skip guard is per (plan, ft_seed)
# and trains EVERY sparsity the plan lists, so keeping 0.2 in here would
# retrain the 0.2 models that are already done. They live in the frozen source
# plan and are not re-entered from this folder.
#
# Do not add a second sparsity to this file later: calculate_MI_prune.py
# records its sha256 in every MI row, and changing the bytes invalidates them.
# Copy it to a new _SparsityNNN_ file instead.
# ======================================================================
Model_Name: CIFAR-100_ResNet-18_25000
Scenario_Name: CIFAR-100_ResNet-18_25000_Same_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
  note: same
Model: ResNet-18
Optimizers:
- name: SGD
  sparsity: 0.6
  params:
    lr: 0.0001
    momentum: 0.9
    weight_decay: 0.0002
    nesterov: true
  Epochs: 50
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128
