# Repeated DI (main_DI_repeat.py / main_DI_repeat_paper.py) -- suite C100_at_posthoc.
# Victim: CIFAR-100_ResNet-18_25000 (seed 42, group_A 25000). Suspects: the post-hoc AT models in
# saved_models/at_posthoc, LAST epoch (epoch_29.pth; training runs 30 epochs, 0..29).
# The last epoch is named explicitly: State: last would pick the newest file by mtime, which can be
# best_rob_epoch.pth / best_clean_epoch.pth.
# Set = the formal runs of saved_exp_plan/at_posthoc_plan/CIFAR100_RES18_PostAT_FTAL_DKD_Knockoff.yaml
# (3 sources FT-AL / DKD / Knockoff x PGD eps 2,4,8/255, atseed 2, run v1), names rebuilt with
# main_at_posthoc.expand_plan and checked to have epoch_29.pth as their highest epoch.
# The atseed=0 folders in at_posthoc are not formal runs (7 empty, 2 DKD pilots) and are left out,
# as in saved_exp_plan/at_posthoc_eval_plan/CIFAR100_RES18_PostAT_4Baselines.yaml (AT_Seeds: [2]).
# Checkpoints are plain ResNet-18 state dicts, fed raw [0,1] images through NormalizedModel.
Scenario_Name: CIFAR-100_ResNet-18_25000_DI_Repeat_AtPosthoc_LastEpoch
Victim:
  Model_Name: CIFAR-100_ResNet-18_25000
  Model: ResNet-18
  Seed: 42
  Overlap: 1.0
  Dataset:
    name: CIFAR-100
    normalization: cifar100
    img_size: 32
    group_size: 25000
    download: false
DI:
  N_Train_Samples: 1000
  N_Test_Samples:
  - 1000
  Alpha: 0.05
Positive:
# --- FT-AL source, post-hoc AT at eps 2/255, 4/255, 8/255
- Model: ResNet-18
  State: last
  Checkpoint: epoch_29.pth
  Require_Checkpoints: true
  Model_Path:
  - at_posthoc/CIFAR-100_ResNet-18_25000_Same_25000_42_1.0_FT-AL_ftsize=25000_ftseed=0_PGD_eps=0.007843_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18_25000_Same_25000_42_1.0_FT-AL_ftsize=25000_ftseed=0_PGD_eps=0.015686_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18_25000_Same_25000_42_1.0_FT-AL_ftsize=25000_ftseed=0_PGD_eps=0.031373_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
# --- DKD source, post-hoc AT at eps 2/255, 4/255, 8/255
- Model: ResNet-18
  State: last
  Checkpoint: epoch_29.pth
  Require_Checkpoints: true
  Model_Path:
  - at_posthoc/CIFAR-100_ResNet-18to18_25000_DKD_0_0.0_PGD_eps=0.007843_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18to18_25000_DKD_0_0.0_PGD_eps=0.015686_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18to18_25000_DKD_0_0.0_PGD_eps=0.031373_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
# --- Knockoff source, post-hoc AT at eps 2/255, 4/255, 8/255
- Model: ResNet-18
  State: last
  Checkpoint: epoch_29.pth
  Require_Checkpoints: true
  Model_Path:
  - at_posthoc/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
  - at_posthoc/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_0_1.0_PGD_eps=0.031373_steps=10_bn=joint_atn=25000_atepochs=30_lr=0.0003_lambda=1_advfrac=0.25_run=v1_atseed=2_mix=add
