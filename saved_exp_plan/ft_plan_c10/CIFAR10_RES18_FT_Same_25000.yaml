# ======================================================================
# CIFAR-10 fine-tuning - source model CIFAR-10_ResNet-18_25000
#   checkpoint : saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0/best_epoch.pth
#   driver     : main_ft
#   FT-LL 10ep lr=0.01  FT-AL 25ep lr=0.001  RT-AL 50ep lr=0.005
#
# FT data = the OTHER 25000 CIFAR-10 images, matching the CIFAR-100 row.
# FT_Dataset.name is the dataset's own name, which sends
# util.determine_ft_dataset down its create_or_load_group_B(0.0) branch -
# group_A's disjoint complement. This is NOT the pseudo-labelled ImageNet
# subset the older CIFAR-10 runs used, so _Same_25000 does not collide
# with the _PseudoLabel_25000 models already on disk.
# Generated by saved_exp_plan/make_c10_ft_prune_plans.py - edit there.
# ======================================================================
Model_Name: CIFAR-10_ResNet-18_25000
Scenario_Name: CIFAR-10_ResNet-18_25000_Same_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: &id001
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms: &id002
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: *id001
  test_transforms: *id002
  group_size: 25000
  note: same
Model: ResNet-18
Optimizers:
- name: SGD
  strategy: FT-LL
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 10
- name: SGD
  strategy: FT-AL
  params:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 25
- name: SGD
  strategy: RT-AL
  params:
    lr: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 50
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128
