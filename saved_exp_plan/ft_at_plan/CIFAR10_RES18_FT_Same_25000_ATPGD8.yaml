# ======================================================================
# CIFAR-10 fine-tuning WITH an added adversarial term (one-stage AT for the
# FT family; driver: main_ft_at.py). Everything above the AdversarialTraining
# block is a copy of saved_exp_plan/ft_plan_c10/CIFAR10_RES18_FT_Same_25000.yaml:
#   source model : saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0/best_epoch.pth
#   FT data      : the OTHER 25000 CIFAR-10 images (group_B 0.0), served raw for PGD
#   FT-LL 10ep lr=0.01  FT-AL 25ep lr=0.001  RT-AL 50ep lr=0.005  (unchanged)
#
# Per batch:  L = CE(f(x), y) + lambda * CE(f(x_adv), y),  lambda = 1, no rescaling.
# ======================================================================
Model_Name: CIFAR-10_ResNet-18_25000
Scenario_Name: CIFAR-10_ResNet-18_25000_Same_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: &id001
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms: &id002
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: *id001
  test_transforms: *id002
  group_size: 25000
  note: same
Model: ResNet-18
Optimizers:
- name: SGD
  strategy: FT-LL
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 10
- name: SGD
  strategy: FT-AL
  params:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 25
- name: SGD
  strategy: RT-AL
  params:
    lr: 0.005
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 50
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128

# ---- Added adversarial term (new) ----
AdversarialTraining:
  form: additive     # L = L_ft(x) + lambda * L_ft(x_adv); weights used as given
  lambda: 1.0
  # frozen: every BatchNorm stays in eval mode for both forwards (running stats fixed to the
  # victim's clean statistics, affine params train), so the trained, attacked and deployed
  # functions coincide. "both" learns a batch-statistics switch instead of robust features
  # (91%/0.4% with clean stats vs 29%/15% with adversarial stats for the same weights) and
  # "clean_eval" lets the running stats drift (collapse to ~10-30% clean). See at_family_common.py.
  bn_policy: frozen

# Same grid semantics as main_at.py: list-valued fields expand position-wise.
Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373]   # 2/255, 4/255, 8/255 (same grid as main_at.py plans)
  steps: 10
