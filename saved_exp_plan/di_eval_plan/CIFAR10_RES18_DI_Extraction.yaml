# Extraction positives under the CLEAN DI protocol (self-implemented path,
# main_DI_eval.py): no DI.Regressor_Path, so the regressor is trained (once,
# cached as saved_models/di_regressor/victim=..._n=1000_clean.pt) on the
# victim with un-augmented private images (raw_train_clean_set) and
# un-augmented public images (raw_test_set); suspects are scored on the same
# clean sets. The DI block below is honoured on the train path too:
# N_Train_Samples / N_Test_Samples / Alpha / Master_CSV; Point_Batch_Size and
# Seed are fixed-regressor-only keys and are ignored here.
# The legacy plan CIFAR10_RES18_DI_Extraction_AT.yaml (stale augmented regressor,
# Private_Transform: legacy_augmented) is kept unchanged for the record.
Scenario_Name: CIFAR-10_ResNet-18_25000_DI_Extraction
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Seed: 42
  Overlap: 1.0
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    group_size: 25000
    download: false
DI:
  N_Train_Samples: 1000
  N_Test_Samples:
  - 1000
  Alpha: 0.05
  Master_CSV: saved_logs/at_eval/DI/master_DI.csv
Positive:
- Model: ResNet-18
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0 # DFMS
  # KnockOff
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_1_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_2_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_3_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_4_1.0

  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_0_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_1_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_2_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_3_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_4_1.0
- Model: VGG16
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Cross16_0_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Cross16_1_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Cross16_2_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Cross16_3_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Cross16_4_1.0
  
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16_0_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16_1_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16_2_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16_3_1.0
  - extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16_4_1.0
- Model: DeiT
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - extraction_vanilla/Transformer_Models/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_CrossDeiT_0_1.0
  - extraction_vanilla/Transformer_Models/CIFAR-10_ResNet-18_25000_Knockoff_Same10_CrossDeiT_0_1.0
