# ======================================================================
# CIFAR-10 pruning WITH an added adversarial term in the recovery fine-tuning
# (one-stage AT for the pruning family; driver: main_prune_at.py).
# Everything above the AdversarialTraining block is a copy of
# saved_exp_plan/prune_plan_c10/CIFAR10_RES18_PRUNE_Same_25000.yaml:
#   source model : saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0/best_epoch.pth
#   pruning      : global L1 magnitude, every Conv2d/Linear weight, sparsity 0.2 / 0.8
#   recovery     : FT-AL 50 ep lr 0.001 on the OTHER 25000 CIFAR-10 images (group_B 0.0)
# Only the sparsities selected with --sparsity are run (default 0.8).
#
# Per batch of the recovery:  L = CE(f(x), y) + lambda * CE(f(x_adv), y),  lambda = 1, no rescaling.
# No-AT reference: saved_models/pruning_final/..._sparsity=0.8_FT-AL_ftsize=25000_ftseed=<s>
# (seed 0: pre-recovery 82.27%, best 93.89%).
# ======================================================================
Model_Name: CIFAR-10_ResNet-18_25000
Scenario_Name: CIFAR-10_ResNet-18_25000_Same_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: &id001
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms: &id002
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: *id001
  test_transforms: *id002
  group_size: 25000
  note: same
Model: ResNet-18
Optimizers:
- name: SGD
  sparsity: 0.2
  params: &id003
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 50
- name: SGD
  sparsity: 0.8
  params: *id003
  Epochs: 50
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128

# ---- Added adversarial term (new) ----
AdversarialTraining:
  form: additive     # L = L_prune(x) + lambda * L_prune(x_adv); weights used as given
  lambda: 1.0
  # frozen: the recovery starts from the victim's weights (see at_family_common.py).
  bn_policy: frozen
  # Optional one-off recomputation of the running statistics on clean auxiliary images right
  # after pruning, before freezing. Measured 2026-09-22 at sparsity 0.8, eps 8/255, 10 epochs:
  # recalibration lowers the pre-recovery accuracy (77.2% vs 82.3% with the victim's own stats,
  # weights and stats are co-adapted) and the recovered models are indistinguishable
  # (80.8/35.8 vs 80.8/35.4). Kept off: the recovery then starts exactly where main_prune.py's
  # does. Recorded in the scenario name as _recal=none (true -> _recal=clean).
  recalibrate_bn_after_prune: false

# Same grid semantics as main_at.py; select a subset at run time with --eps.
Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373]   # 2/255, 4/255, 8/255
  steps: 10
