# ======================================================================
# CIFAR-10 post-hoc (two-stage) adversarial fine-tuning of the four derived models of one victim,
# with the SAME clean-priority recipe as CIFAR100_RES18_PostAT_FTAL_DKD_Knockoff.yaml.
# Driver: main_at_posthoc.py.   Victim: CIFAR-10_ResNet-18_25000_42_1.0 (93.90% clean).
#
# Purpose: an epoch-by-epoch TRAJECTORY. Every epoch is checkpointed (SAVE_ALL_EPOCHS, the driver
# default), so each run leaves epoch_-1.pth (= the untouched source) and epoch_0 ... epoch_29 --
# 31 points per run -- and MI can be read at each one to watch a suspect move relative to the null
# as the attacker adversarially fine-tunes it.
#
# Sources (best_epoch.pth), all ResNet-18 so all four share the one ResNet-18 negative pool.
# Both attack families that build a NEW model are same-architecture on purpose: a surrogate of a
# different architecture would be compared against a different null and the four trajectories
# would not be on one axis.
#   FT-AL      ft_final/...Same_25000_42_1.0_FT-AL_ftsize=25000_ftseed=0                  93.89%
#   Prune20    pruning_final/...sparsity=0.2_FT-AL_ftsize=25000_ftseed=0                  94.21%  (20.00% zeros)
#   DKD        kd_final/CIFAR-10_ResNet-18to18_25000_DKD_0_0.0                            93.42%  (RN18 -> RN18)
#   Knockoff   extraction_final/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_0_1.0     92.29%  (RN18 -> RN18)
# All four verified 2026-09-24 to load strict=True into Model.ResNet_18.ResNet18(num_classes=10);
# the DKD checkpoint was written from ResNet18_dist and carries no extra keys.
#
# ---------------------------------------------------------------------------------------------
# Aliases: required, and NOT free-form
# ---------------------------------------------------------------------------------------------
# The output folder is <source-or-alias> + the AT suffix, and two separate limits bite:
#   * length. The un-aliased pruning name gives a 265-character checkpoint path, over the 260
#     Windows limit (FT-AL 242, Knockoff 225, DKD 210 are fine).
#   * parsing. calculate_MI_at.parse_at_scenario_name splits the AT suffix on '=' pairs, so ANY
#     '=' inside the source part makes the folder unreadable downstream. That is why the six
#     CIFAR-100 FT-AL post-hoc folders (...ftsize=25000_ftseed=0_PGD_...) do not parse today.
# So FT-AL and Prune20 get aliases that contain no '=' and keep the _<seed>_<rate> tail the parser
# expects; DKD and Knockoff need none, their own names already satisfy both rules. <run>/source.json
# records the real source path either way. Checked: all four resulting names parse.
#
# AT data: the other 25000 CIFAR-10 training images (group_B 0.0, disjoint from the victim's group_A),
# ground-truth labels. Per batch (B = 128): 32 PGD-10 copies (adv_fraction 0.25), one train-mode
# forward on the 160 images (joint BN), L = CE(128 clean) + 1.0 * CE(32 adversarial).
# SGD lr 3e-4 cosine -> 1e-6, 30 epochs, momentum 0.9 nesterov, wd 5e-4. eps 2/4/8 /255.
# The pruned model keeps its zero mask during AT (Keep_Zero_Mask): pruned weights are reset to zero
# after every optimiser step, so the whole trajectory stays 20% sparse.
#
# NOTE ON lr. 3e-4 was tuned on the CIFAR-100 sources, whose pre-BN scale is tiny (median running_var
# 4e-5); CIFAR-10 weights are larger, so the same lr is a gentler step here and the trajectory may
# barely move. Kept identical for cross-dataset comparability -- but run one cell for a few epochs
# first and look at how far clean/robust accuracy travels before committing the full 12 runs. The
# --lr override is recorded in the folder name, so a re-tuned run cannot collide with this one.
# ======================================================================
Model_Path:
  - Path: /ft_final/CIFAR-10_ResNet-18_25000_Same_25000_42_1.0_FT-AL_ftsize=25000_ftseed=0
    Alias: C10_RN18_Same_FT-AL_0_1.0
  - Path: /pruning_final/CIFAR-10_ResNet-18_25000_Same_25000_42_1.0_sparsity=0.2_FT-AL_ftsize=25000_ftseed=0
    Alias: C10_RN18_Same_Prune20-FT-AL_0_1.0
    Keep_Zero_Mask: true
  - /kd_final/CIFAR-10_ResNet-18to18_25000_DKD_0_0.0
  - /extraction_final/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_0_1.0
  # Optional extension (source-seed variance): ftseed=1,2 for FT-AL and Prune20,
  # Knockoff_Same10_Same18_{1,2}_1.0 for extraction. KD has seed 0 only on CIFAR-10.

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000
  note: same

Model: ResNet-18

AdversarialTraining:
  form: additive      # L = CE(x) + lambda * CE(x_adv); weights used as given
  lambda: 1.0
  bn_policy: joint
  adv_fraction: 0.25  # 128 clean + 32 adversarial per step

Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373]   # 2/255, 4/255, 8/255
  steps: 10

Optimizer:
  name: SGD
  params:
    lr: 0.0003
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 30

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.000001

BatchSize: 128
