# ======================================================
# KD positive models - Cell A / Cell C, cross-family student
#   Teacher: ResNet-18 (victim, group_A, 25000)
#   Student: VGG16      -> matches the `Cross16` Knockoff positive and the
#                          VGG16 negative pool in vanilla/CNN_Models
#
# FitNet is intentionally ABSENT. ResNet feats[2] is (128,16,16) while VGG
# feats[2] is (256,4,4); ConvReg aligns channels only, so the hint MSE cannot
# be formed. Only the logit-based methods (KD, DKD) are architecture-agnostic.
# ======================================================
Scenario_Name: CIFAR-10_ResNet-18toVGG16_25000

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Teacher_Model:
  teacher_name: ResNet-18
  teacher_ckpt: "./saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0/best_epoch.pth"

Student_Model:
  student_name: VGG16

Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005

Distillation:
  - name: KD
    params:
      TEMPERATURE: 4
      CE_WEIGHT: 0.1
      KD_WEIGHT: 0.9

  - name: DKD
    params:
      CE_WEIGHT: 1.0
      ALPHA: 1.0
      BETA: 8.0
      T: 4.0
      WARMUP: 20

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.000001

Epochs: 200
BatchSize: 128
