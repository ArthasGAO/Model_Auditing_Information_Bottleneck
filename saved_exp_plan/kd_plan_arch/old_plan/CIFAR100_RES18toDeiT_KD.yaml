# ======================================================
# KD positive models - Cell A / Cell C, CNN -> Transformer student
#   Teacher: ResNet-18 (victim, group_A, 25000)
#   Student: DeiT-Tiny  -> matches the DeiT_Plain negative pool in
#                          vanilla/Transformer_Models
#
# This is the canonical cross-architecture case (DeiT itself distils a CNN
# teacher into a ViT student). FitNet is ABSENT: a ViT emits token sequences
# [B, N, D], not conv feature maps, so there is no hint stage to align.
#
# Optimizer / augmentation mirror the DeiT_Plain recipe in
# saved_exp_plan/train_plan/CIFAR10_DeiT_Plain_SMALL.yaml so that the student
# stays comparable with the DeiT negatives. Batch-level mixup is NOT applied -
# train_one_epoch_kd has no mixup path - but that recipe had use_mixup: False.
# ======================================================
Scenario_Name: CIFAR-100_ResNet-18toDeiT_25000

Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 7}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.15, scale: [0.02, 0.25], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Teacher_Model:
  teacher_name: ResNet-18
  teacher_ckpt: "./saved_models/vanilla/CNN_Models/CIFAR-100_ResNet-18_25000_42_1.0/best_epoch.pth"

Student_Model:
  student_name: DeiT
  model_name: deit_tiny_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: False
  drop_path_rate: 0.1

Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.03
    amsgrad: False

Distillation:
  - name: KD
    params:
      TEMPERATURE: 4
      CE_WEIGHT: 0.1
      KD_WEIGHT: 0.9

  - name: DKD
    params:
      CE_WEIGHT: 1.0
      ALPHA: 1.0
      BETA: 8.0
      T: 4.0
      WARMUP: 20

Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 10
    warmup_start_factor: 0.1
    T_max: auto
    eta_min: 0.000001

Epochs: 400
BatchSize: 128
