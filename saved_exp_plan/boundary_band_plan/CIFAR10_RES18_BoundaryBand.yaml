# ======================================================
# Phase-1 decision-boundary distance gate (band membership) for the
# CIFAR-10 / ResNet-18 victim. Read-only DeepFool-style estimator.
#
# Coordinate system = Option A: gradients flow through NormalizedModel with
# raw [0,1] inputs, so d is in RAW-PIXEL L2 units (same space as PGD/IPGuard).
#
# Run:  python main_boundary_band_eval.py
# Out:  saved_logs/at_eval/BoundaryBand/master.csv
#       Indices/CIFAR-10/BoundaryBand/...   (cached stats; re-tuning d is free)
# ======================================================
Scenario_Name: CIFAR-10_ResNet-18_25000_42_1.0_BoundaryBand

Victim:
  Model_Name: CIFAR-10_ResNet-18_25000   # load_victim_model hard-codes seed=42, overlap=1.0
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000

BoundaryBand:
  order: first        # "first" (DeepFool 1-step) or "second" (curvature-corrected)
  topk: null          # null => all 9 competitors (exact for CIFAR-10); use K for CIFAR-100
  percentile: 1.0     # d = 1st percentile of the benign Delta distribution
  max_samples: 1000   # benign test queries to score in the collect pass
  # d: 0.5            # optional: pin d explicitly and skip calibration
  # fd_r: 0.01        # curvature finite-difference radius (order: second only)
  # corr_tol: 0.0     # skip 2nd order for a query when |correction| <= this

# Optional: score a probe set (raw [0,1] images) to get the detection rate at d.
# Accepts an IPGuard fingerprint .pt (dict with 'test_x') or a bare image tensor.
# Probe:
#   Path: ./Indices/CIFAR-10/IPGuard/victim=ResNet-18_.../TR.pt
#   Key: test_x
