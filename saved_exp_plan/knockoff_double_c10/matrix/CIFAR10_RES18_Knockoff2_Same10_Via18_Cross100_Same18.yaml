# ======================================================================
# Double knockoff extraction -- hop 2 of 2   (GENERATED, do not hand-edit)
#   make_double_plans.py  ->  Via18_Cross100_Same18
# ======================================================================
# chain    : CIFAR-10 ResNet-18 (victim)  ->  ResNet-18 (S1)  ->  ResNet-18 (S2)
# hop 1    : CIFAR-10 group_B   CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18
#            already trained, seeds 0..4, test acc 92.3-92.4%, d = 27.00 p95
# hop 2    : CIFAR-100 group_B -- 25 000 OOD images, disjoint from every CIFAR-10 group
# suspect  : S2, measured against Negative_Model_Pool_0.0/CNN  (ResNet-18, 80)
#
# COMPARE AGAINST, and nothing else:
#   CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18
#   d = 61.37 p95   I(T;Y) = +13.75 p95   (3 seeds, extraction_vanilla/)
# That is the 1-hop surrogate of the VICTIM with this cell's query set
# AND architecture, so it differs from this cell only in hop count.
# Comparing a Cross100 cell against a Same10 number instead would show
# two hops 'strengthening' the signal -- the query set alone moves d by
# 2-5x, almost all of it on the I(X;T) axis. Prefer I(T;Y) when reading
# across query sets; it is the inherited-competence axis and is stable.
#
# query    : soft labels, KL objective, clean transforms -- same attack
#            as hop 1; only the queried model (and, in the Cross100
#            arm, the query pool) differ
# recipe   : how a CIFAR-10 ResNet-18 is normally trained, unchanged
#            from the one-hop plan
# run      : main_knockoff_extraction_double.py   (NOT the one-hop drivers:
#            main_knockoff_extraction.py ignores Model_Dir and would load
#            the ORIGINAL victim from vanilla/, silently redoing hop 1)
# MI       : calculate_MI_extraction.py -- listed in EXTRACTION_BEST_PLANS
# ======================================================================
Scenario_Name: CIFAR-10_ResNet-18_25000_Knockoff2_Same10_Via18_Cross100_Same18
Chain:
  hop0_victim: CIFAR-10_ResNet-18_25000  (ResNet-18, group_A, seed 42, rate 1.0)
  hop1_surrogate: CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18  (ResNet-18, queried with CIFAR-10 group_B,
    test acc 92.3-92.4%, d = 27.00 p95)
  hop2_surrogate: CIFAR-10_ResNet-18_25000_Knockoff2_Same10_Via18_Cross100_Same18  (ResNet-18)  <- the
    suspect
  hop2_query_pool: CIFAR-100 group_B -- 25 000 OOD images, disjoint from every CIFAR-10 group
  measured_against: Negative_Model_Pool_0.0/CNN  (ResNet-18, 80)
  compare_with: CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18
  compare_with_d_over_p95: '61.37'
  compare_with_I_T_Y_over_p95: '+13.75'
  compare_with_note: 3 seeds, extraction_vanilla/
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18
  Model_Dir: ./saved_models/extraction_final
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params:
        size: 32
        padding: 4
    - name: RandomHorizontalFlip
      params:
        p: 0.5
    - name: ToTensor
    - name: Normalize
    test_transforms:
    - name: ToTensor
    - name: Normalize
    group_size: 25000
Substitute:
  Model: ResNet-18
Auxiliary_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Knockoff:
  sampling_size: 1.0
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 160
    eta_min: 1.0e-06
Epochs: 160
BatchSize: 128
