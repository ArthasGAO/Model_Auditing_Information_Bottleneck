# Dataset Inference baseline through the OFFICIAL code path (main_DI_official_eval.py).
# Victim = CIFAR-10 ResNet-18 seed 42 (group_A, 25000). Suspect paths are
# relative to saved_models/. Only best_epoch.pth is scored (Checkpoint field).
# DI tests data usage: negatives with overlap 1.0 share the victim's training
# data and are EXPECTED to be flagged; overlap 0.0 is the true DI null.
Scenario_Name: CIFAR-10_ResNet-18_25000_42_1.0_Pos_Extraction_AT
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Seed: 42
  Overlap: 1.0
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    group_size: 25000
    download: false
Positive:
- Model: ResNet-18
  State: best
  Checkpoint: best_clean_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.007843_steps=10_atseed=0_mix=off
