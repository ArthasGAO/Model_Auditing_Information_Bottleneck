# Dataset Inference baseline through the OFFICIAL code path (main_DI_official_eval.py).
# Victim = CIFAR-100 ResNet-18 seed 42 (group_A, 25000). Suspect paths are
# relative to saved_models/. Only best_epoch.pth is scored (Checkpoint field).
# Suspects: the 9 CIFAR-100 RN18-victim knockoff clones in extraction_final
# (Same100 query pool): Same18 / Cross16 / CrossDeiT x seeds 0..2.
# The DeiT clones are deit_tiny_distilled_patch16_224 (img 32, patch 4), hence
# Model_Config on that block (plain-DeiT builder cannot load them).
# Features are cached under
#   saved_logs/di_official/files/victim=ResNet-18_CIFAR-100_25000_seed=42_overlap=1.0/CIFAR100/
# and the victim is re-used as "teacher" for the regressor, as for CIFAR-10.
#
# Run (from E:\Experiment), CIFAR-100 rows kept out of the CIFAR-10 master.csv:
#   python main_DI_official_eval.py --yaml saved_exp_plan/di_official_plan/CIFAR100_RES18_DIofficial_Extraction.yaml --master saved_logs/di_official/master_C100_Extraction.csv
Scenario_Name: CIFAR-100_ResNet-18_25000_42_1.0_Pos_Extraction
Victim:
  Model_Name: CIFAR-100_ResNet-18_25000
  Model: ResNet-18
  Seed: 42
  Overlap: 1.0
  Dataset:
    name: CIFAR-100
    normalization: cifar100
    img_size: 32
    group_size: 25000
    download: false
Positive:
- Model: ResNet-18
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_0_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_1_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Same18_2_1.0
- Model: VGG16
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Cross16_0_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Cross16_1_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_Cross16_2_1.0
- Model: DeiT
  State: best
  Checkpoint: best_epoch.pth
  Require_Checkpoints: true
  Model_Config:
    model_name: deit_tiny_distilled_patch16_224
    img_size: 32
    patch_size: 4
  Model_Path:
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_CrossDeiT_0_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_CrossDeiT_1_1.0
  - extraction_final/CIFAR-100_ResNet-18_25000_Knockoff_Same100_CrossDeiT_2_1.0
