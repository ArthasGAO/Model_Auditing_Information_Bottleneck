Victim_Scenario: CIFAR-100_VGG16_25000           # saved_models/victim/<Victim_Scenario>_42_1.0/best_epoch.pth
Scenario_Name: CIFAR-100_VGG16_25000_Same_25000

Dataset: &victim_data                            # how the victim was trained (defines group_A and the MI probe set)
  name: CIFAR-100
  root_dir: ./data
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

FT_Dataset:                                      # the attacker's data: group_B of the same dataset
  <<: *victim_data
  group_size: 25000                              # |group_B| -> "ftsize=" in the model name

Model: VGG16

Optimizers:
  - {strategy: FT-LL, name: SGD, Epochs: 30, params: {lr: 0.01,   momentum: 0.9, weight_decay: 0.0005, nesterov: true}}
  - {strategy: FT-AL, name: SGD, Epochs: 50, params: {lr: 0.0003, momentum: 0.9, weight_decay: 0.0005, nesterov: true}}
  - {strategy: RT-AL, name: SGD, Epochs: 80, params: {lr: 0.0005, momentum: 0.9, weight_decay: 0.0005, nesterov: true}}

Scheduler:
  name: CosineAnnealingLR
  params: {T_max: auto, eta_min: 1.0e-06}     # auto -> the strategy's Epochs
