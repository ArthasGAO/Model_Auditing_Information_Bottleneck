# Required by main_DEEPJUDGE_eval.py (RobD needs an adversarial test set).
# Same attack as every earlier DeepJudge run, so the cached adversarial set
# (Indices/adv_examples/CIFAR-10_ResNet-18_PGD_eps=0.03_step_size=0.003_steps=10.pt)
# and the cached RobD threshold are reused instead of regenerated.
Attack:
  name: PGD
  eps: 0.03
  steps: 10
  step_size: 0.003

# main_IPGUARD_eval.py: YAML overrides the (k_params, sizes) passed from
# __main__ (currently k=0.01, an ablation setting). k=5 / size=100 is the
# setting of the main IPGuard table and of the 2026-09-09 KD run, and its
# fingerprint cache already exists under Indices/CIFAR-10/IPGuard/.
IPGuard:
  k_Params:
  - 5 
  Sizes:
  - 100

# main_adv_tra.py: fingerprint cache root under results/advtra1/. Same value
# as Scenario_Name; kept explicit so the positive run cannot drift away from
# the victim's cached 100-trajectory fingerprint.
ADV_TRA:
  Fingerprint_Root: CIFAR-10_ResNet-18_25000_42_1.0



