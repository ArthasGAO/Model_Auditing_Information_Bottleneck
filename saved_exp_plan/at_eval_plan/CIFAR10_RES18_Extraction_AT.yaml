# Extraction positives that were adversarially fine-tuned by main_at.py
# (saved_models/at_evasion/*). Evaluated by main_IPGUARD_eval.py,
# main_DEEPJUDGE_eval.py and main_adv_tra.py (positive path).
#
# Scenario_Name must stay the VICTIM id: main_adv_tra.py uses it as the
# fingerprint cache root (results/advtra1/<Scenario_Name>), so a per-experiment
# suffix would trigger a fresh, non-comparable fingerprint extraction.
# IPGuard / DeepJudge do not read it (they key caches on the Victim block).
Scenario_Name: CIFAR-10_ResNet-18_25000_42_1.0

Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
      - {name: RandomCrop, params: {size: 32, padding: 4}}
      - {name: RandomHorizontalFlip, params: {p: 0.5}}
      - {name: ToTensor}
      - {name: Normalize}
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000

Positive:
  Model: ResNet-18
  State: best
  # main_at.py writes best_clean_epoch.pth / best_rob_epoch.pth / epoch_N.pth
  # and never best_epoch.pth, so `State: best` alone finds nothing. An explicit
  # Checkpoint is honoured by all three evaluators (and by main_DI_eval.py).
  Checkpoint: best_clean_epoch.pth
  Require_Checkpoints: true
  Model_Path:
  # DFMS
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=0_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=1_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=2_mix=0.8

  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=0_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=1_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=2_mix=0.8

