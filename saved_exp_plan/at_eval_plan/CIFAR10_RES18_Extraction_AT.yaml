  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.031373_steps=10_bn=clean_atseed=1_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0_PGD_eps=0.031373_steps=10_bn=clean_atseed=2_mix=0.8

  # KnockOff Cross100
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=0_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=1_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.007843_steps=10_bn=clean_atseed=2_mix=0.8

  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=0_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=1_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.015686_steps=10_bn=clean_atseed=2_mix=0.8

  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.031373_steps=10_bn=clean_atseed=0_mix=0.8
  - at_evasion/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0_PGD_eps=0.031373_steps=10_bn=clean_atseed=1_mix=0.8
