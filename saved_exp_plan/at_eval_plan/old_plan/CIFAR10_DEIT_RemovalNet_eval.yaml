# ======================================================
# Defense eval (DeepJudge / IPGuard) of the DeiT logit-only RemovalNet model.
# Model: "DeiT" routes through the DeiT branches in util_adv (build via timm,
# load from Transformer_Models, wrap in NormalizedModel).
#
# PREREQUISITE: run `python main_removalnet_deit.py` first to produce the suspect
# dir under saved_models/removalnet_vanilla/Transformer_Models/. Verify the exact
# folder name and update Model_Path below if your iterations/seed differ.
# ======================================================
Scenario_Name: CIFAR-10_DeiT_Plain_25000_42_1.0_RemovalNet

Victim:
  Model_Name: CIFAR-10_DeiT_Plain_25000
  Model: DeiT
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
      - {name: RandomCrop, params: {size: 32, padding: 4}}
      - {name: RandomHorizontalFlip, params: {p: 0.5}}
      - {name: ToTensor}
      - {name: Normalize}
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000

Positive:
  Model: DeiT
  State: last        # newest *.pth = final removed model (works with step_N.pth)
  Model_Path:
    - /removalnet_vanilla/Transformer_Models/CIFAR-10_DeiT_Plain_25000_RemovalNet_42_1.0_logitonly_iters500_aseed=0

Attack:                 # used by DeepJudge only
  name: PGD
  eps: 0.03
  steps: 10
  step_size: 0.003
