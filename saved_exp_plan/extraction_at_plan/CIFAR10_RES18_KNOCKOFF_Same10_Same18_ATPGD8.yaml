# ======================================================
# Knockoff extraction WITH an added adversarial term (one-stage AT;
# driver: main_knockoff_extraction_at.py).
# Victim:     CIFAR-10 ResNet-18 (saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0)
# Substitute: ResNet-18 trained from scratch on the victim's soft labels
# Query set:  the 25,000 CIFAR-10 training images disjoint from the victim's
#             (Indices/CIFAR-10/group_B_25000_0.0_25000_seed42.npy), queried once, clean.
# Everything above the AdversarialTraining block is a copy of
# saved_exp_plan/extraction_plan/CIFAR10_RES18_KNOCKOFF_Same10_Same18.yaml.
#
# Per batch:  L = KL(f(x) || p_victim(x)) + lambda * KL(f(x_adv) || p_victim(x)),  lambda = 1.
# ======================================================

Scenario_Name: CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18

Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
      - {name: RandomCrop, params: {size: 32, padding: 4}}
      - {name: RandomHorizontalFlip, params: {p: 0.5}}
      - {name: ToTensor}
      - {name: Normalize}
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000

Substitute:
  Model: ResNet-18

Auxiliary_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Knockoff:
  sampling_size: 1.0

# ---- Added adversarial term (new) ----
AdversarialTraining:
  form: additive       # L = L_knockoff(x) + lambda * L_knockoff(x_adv); weights used as given
  lambda: 1.0
  # both: from-scratch substitute, so no statistics to freeze; both loss forwards in train
  # mode and BN updated by both (Madry/TRADES/ARD practice). Validate every model with
  # diagnose_bn_modes.py before use.
  bn_policy: both
  # hard: PGD maximises CE against argmax p_victim(x) (util_adv.pgd_attack_v2)
  # soft: PGD maximises KL against p_victim(x)
  inner_target: hard

# Same grid semantics as main_at.py; select a subset at run time with --eps.
Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373]   # 2/255, 4/255, 8/255
  steps: 10

# Same substitute recipe as the plain knockoff plan.
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto        # = Epochs, or the --epochs override
    eta_min: 0.000001

Epochs: 160
BatchSize: 128
