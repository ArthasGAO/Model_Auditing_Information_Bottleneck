Scenario_Name: CIFAR-100_DeiT_Plain_25000

Dataset:
  name: CIFAR-100
  normalization: cifar100         
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 9}}   # 7 → 9
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.20, scale: [0.02, 0.20], ratio: [0.3, 3.3]}}  # 0.15 → 0.25
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Model:
  model_name: deit_tiny_patch16_224   # arch keeps the same
  img_size: 32
  patch_size: 4
  pretrained: False
  drop_path_rate: 0.15               # 0.1 → 0.15

Augmentation:
  use_mixup: False                     
  mixup_alpha: 0.4                     
  cutmix_alpha: 0.7
  prob: 0.8
  switch_prob: 0.5
  label_smoothing: 0.15                 # keep 0.1

Distillation:
  enabled: False                       # keep plain
  type: hard
  alpha: 0.5
  tau: 2.0
  teacher_name: ResNet-18
  teacher_ckpt: ""                     

Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.05                 # 0.03 → 0.05
    amsgrad: False

Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 15                  # 10 → 15
    warmup_start_factor: 0.1
    T_max: 260                         
    eta_min: 0.000001

Epochs: 260                            # 200 → 300