# ======================================================
# Experiment Configuration: CIFAR-10 + VGG16 (SGD + Cosine LR)
# ======================================================

Scenario_Name: CIFAR-10_VGG16_25000_ADAM

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Model: VGG16

Optimizer:
  name: Adam
  params:
    lr: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0005

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 100 #160      # assumes per-epoch stepping
    eta_min: 0.000001

Epochs: 100 #160
BatchSize: 128

