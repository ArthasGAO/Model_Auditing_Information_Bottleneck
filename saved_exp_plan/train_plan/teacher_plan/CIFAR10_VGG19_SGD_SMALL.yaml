# ======================================================================
# VGG19 victim for the bigger-teacher KD row (CIFAR-10).
# Recipe: CIFAR-10 VGG16 pool recipe, 160 ep - matching the trained rate-0.0
# VGG16 logs (the pool yaml's Epochs: 100 is stale) and the ResNet-34 victim.
# Trained 2026-09-21: best_epoch.pth is ep 155, test 91.46% (final ep159 91.41,
# train 99.14, gap 7.73). VGG16 victim for comparison: 91.57 / 99.35 / 7.78.
#
# Launch with main_train_teacher.py (NOT main_train_nega.py):
#   TEACHER_SEEDS=42 TEACHER_RATES=1.0 python main_train_teacher.py
# Scenario_Name carries no seed/rate suffix - main_overlap appends
# _42_1.0, giving ./saved_models/vanilla/CIFAR-10_VGG19_25000_42_1.0/best_epoch.pth
# which is exactly what the kd_plan_matrix cells point at.
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py.
# ======================================================================
Scenario_Name: CIFAR-10_VGG19_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Model: VGG19
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 160
    eta_min: 1.0e-06
Epochs: 160
BatchSize: 128
