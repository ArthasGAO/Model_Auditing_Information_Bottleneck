# ======================================================================
# DeiT-S victim for the bigger-teacher KD row (CIFAR-100).
# Recipe copied from the CIFAR-100 DeiT pool, backbone widened
# deit_tiny -> deit_small (5.36M -> 21.34M).
#
# The distilled backbone is NOT optional: CIFAR-100's only transformer
# pool is DeiT_Distill, so the KD students must be distilled too, and the
# victim follows the same family. Its DeiT teacher is the CIFAR-100
# ResNet-18 VICTIM (group_A, rate 1.0) - a victim may see group_A. The
# pool plan deliberately uses a seed-paired rate-0.0 teacher instead, so
# that negatives never inherit group_A through the teacher's logits.
#
# Model is a dict, so this plan needs main_deit_overlap, NOT main_overlap.
# main_train_teacher.py currently calls main_overlap unconditionally - it
# needs a dict/str branch before this plan can run.
#
# Expect ./saved_models/vanilla/CIFAR-100_DeiT-S_Distill_25000_42_1.0/best_epoch.pth
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py.
# ======================================================================
Scenario_Name: CIFAR-100_DeiT-S_Distill_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomResizedCrop
    params:
      size: 32
      scale:
      - 0.85
      - 1.0
      ratio:
      - 0.9
      - 1.1
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: RandAugment
    params:
      num_ops: 2
      magnitude: 9
  - name: ToTensor
  - name: Normalize
  - name: RandomErasing
    params:
      p: 0.2
      scale:
      - 0.02
      - 0.2
      ratio:
      - 0.3
      - 3.3
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Model:
  model_name: deit_small_distilled_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: false
  drop_path_rate: 0.15
Augmentation:
  use_mixup: false
  label_smoothing: 0.15
Distillation:
  enabled: true
  type: hard
  alpha: 0.5
  tau: 2.0
  teacher_name: ResNet-18
  teacher_ckpt: ./saved_models/vanilla/CNN_Models/CIFAR-100_ResNet-18_25000_42_1.0/best_epoch.pth
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.05
    amsgrad: false
Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 15
    warmup_start_factor: 0.1
    T_max: 260
    eta_min: 1.0e-06
Epochs: 260
BatchSize: 128
