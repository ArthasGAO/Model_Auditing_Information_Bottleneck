# ======================================================================
# ResNet-34 victim for the bigger-teacher KD row (CIFAR-100).
# Recipe: lr / wd / cosine from the CIFAR-100 ResNet-18 pool (wd 1e-3), but
# 400 epochs rather than that pool's 360 - 400 is what the three earlier
# CIFAR-100 ResNet-34 runs used (seeds 42/43/44, test 72.96 / 73.36 / 72.86,
# best 73.37), so this victim stays comparable with that record. Those runs
# left no checkpoint; their logs are in saved_logs/vanilla/Performance_archive/
# and were moved out of Performance/ because main_overlap APPENDS to an
# existing log rather than replacing it.
# For reference the CIFAR-100 victims are RN18 72.13 and VGG16 67.43.
#
# Launch with main_train_teacher.py (NOT main_train_nega.py):
#   TEACHER_SEEDS=42 TEACHER_RATES=1.0 python main_train_teacher.py
# Scenario_Name carries no seed/rate suffix - main_overlap appends
# _42_1.0, giving ./saved_models/vanilla/CIFAR-100_ResNet-34_25000_42_1.0/best_epoch.pth
# which is exactly what the kd_plan_matrix cells point at.
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py.
# ======================================================================
Scenario_Name: CIFAR-100_ResNet-34_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Model: ResNet-34
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.001
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 400
    eta_min: 1.0e-06
Epochs: 400
BatchSize: 128
