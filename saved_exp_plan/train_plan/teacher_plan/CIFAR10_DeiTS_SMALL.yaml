# ======================================================================
# DeiT-S victim for the bigger-teacher KD row (CIFAR-10).
# Recipe copied from the CIFAR-10 DeiT pool, backbone widened
# deit_tiny -> deit_small (5.36M -> 21.34M).
#
# Plain backbone, matching the CIFAR-10 DeiT_Plain pool. No distillation.
#
# Model is a dict, so this plan needs main_deit_overlap, NOT main_overlap.
# main_train_teacher.py currently calls main_overlap unconditionally - it
# needs a dict/str branch before this plan can run.
#
# Expect ./saved_models/vanilla/CIFAR-10_DeiT-S_25000_42_1.0/best_epoch.pth
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py.
# ======================================================================
Scenario_Name: CIFAR-10_DeiT-S_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
  - name: RandomResizedCrop
    params:
      size: 32
      scale:
      - 0.85
      - 1.0
      ratio:
      - 0.9
      - 1.1
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: RandAugment
    params:
      num_ops: 2
      magnitude: 7
  - name: ToTensor
  - name: Normalize
  - name: RandomErasing
    params:
      p: 0.15
      scale:
      - 0.02
      - 0.25
      ratio:
      - 0.3
      - 3.3
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Model:
  model_name: deit_small_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: false
  drop_path_rate: 0.1
Augmentation:
  use_mixup: false
  label_smoothing: 0.1
Distillation:
  enabled: false
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.03
    amsgrad: false
Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 10
    warmup_start_factor: 0.1
    T_max: 200
    eta_min: 1.0e-06
Epochs: 200
BatchSize: 128
