# Independent 25k / 30-epoch run from each original extraction checkpoint.
# Unified entry: python -u main_at.py --epochs 30 --seeds 0 1 2
# With no --epochs filter, main_at.py runs 30-epoch plans before 50-epoch plans.
Model_Path:
  - /victim_models/CIFAR-10_ResNet-18_25000_42_1.0
  

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  # main_at_pos uses group_B_25000_0.0_25000_seed42.npy, raw_train (augmented).
  group_size: 25000
  note: same

Model: ResNet-18

AdversarialTraining:
  use_mixed: false
  mix_rate: 0.0  # Ignored when use_mixed=false; loss is adversarial CE only.

Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373] #,  0.047059] #, 0.062745] # [2/255, 4/255, 8/255, 12/255, 16/255]
  steps: 10

Optimizer:
  name: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 30

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.000001

BatchSize: 128
