# Independent 25k / 50-epoch run; NOT a continuation of the 30-epoch checkpoint.
# Unified entry: python -u main_at.py --epochs 50 --seeds 0 1 2
# Only Optimizer.Epochs differs from the 30-epoch plan;
# T_max=auto stretches the cosine schedule over this run's full 50 epochs.
Model_Path:
  - /extraction_vanilla/CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18_0_1.0
  - /extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Cross100_Same18_0_1.0
  - /extraction_vanilla/CIFAR-10_ResNet-18_25000_Knockoff_Same10_Same18_0_1.0

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000
  note: same

Model: ResNet-18

AdversarialTraining:
  use_mixed: false
  mix_rate: 0.0

Attack:
  name: PGD
  eps: [ 0.031373] #, 0.007843, 0.015686, 0.047059] #, 0.062745] # [2/255, 4/255, 8/255, 12/255, 16/255]
  steps: 10

Optimizer:
  name: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 50

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 0.000001

BatchSize: 128
