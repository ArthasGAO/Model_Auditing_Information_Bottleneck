# ======================================================
# Experiment Configuration: CIFAR-10 + ResNet-18 (SGD + Cosine LR) + fine-tuning + Adversarial Training
# ======================================================
Model_Path: 
  - /vanilla/CIFAR-100_ResNet-18_25000_42_1.0
  - /vanilla/CIFAR-100_ResNet-18_25000_42_0.5
  - /vanilla/CIFAR-100_ResNet-18_25000_42_0.0


  # - /ft_vanilla/CIFAR-10_ResNet-18_25000_Same_10000_longer_42_1.0_FT-LL_0 

Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000 #this represents the data size used for fine-tuning
  note: same

Model: ResNet-18

Attack:
  name: FGSM
  eps: [0.005, 0.01, 0.02, 0.03] #, 0.05, 0.07]
  

Optimizer: # this is the optimizer used to do the adversarial training
  name: SGD
  params:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 30


Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto # <-- dynamic: same as the epochs set for this strategy
    eta_min: 0.000001

BatchSize: 128
