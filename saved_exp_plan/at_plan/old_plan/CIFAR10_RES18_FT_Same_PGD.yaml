# ======================================================
# Experiment Configuration: CIFAR-10 + ResNet-18 (SGD + Cosine LR) + fine-tuning + Adversarial Training
# ======================================================
Model_Path: 
  - /ft_vanilla/CIFAR-10_ResNet-18_25000_Same_10000_42_1.0_FT-LL_ftsize=10000_ftseed=0
  - /ft_vanilla/CIFAR-10_ResNet-18_25000_Same_10000_42_1.0_FT-AL_ftsize=10000_ftseed=0
  - /ft_vanilla/CIFAR-10_ResNet-18_25000_Same_10000_42_1.0_RT-AL_ftsize=10000_ftseed=0
  
  # - /ft_vanilla/CIFAR-10_ResNet-18_25000_Same_10000_longer_42_1.0_FT-LL_0 

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 10000 #this represents the data size used for fine-tuning
  note: same

Model: ResNet-18

Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373] #, 0.047059, 0.062745] # [2/255, 4/255, 8/255, 12/255, 16/255]
  steps: 10


Optimizer: # this is the optimizer used to do the adversarial training
  name: SGD
  params:
    lr: 0.01
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 30


Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto # <-- dynamic: same as the epochs set for this strategy
    eta_min: 0.000001

BatchSize: 128

