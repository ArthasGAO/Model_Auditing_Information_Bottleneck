# ======================================================
# DFMS-HL model extraction  |  tier A1
# Victim:     CIFAR-10 + ResNet-18 (saved_models/vanilla/.../CIFAR-10_ResNet-18_25000_<seed>_1.0)
# Clone:      ResNet-18 (same architecture family)
# Proxy:      CIFAR-100 group_B, the paper's 40 unrelated classes (10,000 images)
# Budget:     800 alternating epochs x ceil(N_proxy/64) x 64 ~= 8.0M hard-label queries
# Paper ref:  ResNet-18 92.06 / AlexNet 76.02 (victims 93.65 / ~80)
# Run with:   main_dfms_extraction.py (SEED_START/SEED_END pick attacker seeds)
# Seeds:      run attacker seeds 0..4 to match the knockoff H1 pool
# NOTE:       mix_ratio 0.5/0.5 (paper: 1.0/0.5) because group_B holds 10k of the 40 classes,
#             half the paper's 20k; this keeps 157 steps and ~10k G samples per offline epoch.
# ======================================================

Scenario_Name: CIFAR-10_ResNet-18_25000_DFMS_Cross100-40C_Same18
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params: {size: 32, padding: 4}
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
Substitute: {Model: ResNet-18}
Proxy:
  type: natural
  split: group_B
  class_filter: cifar100_40_unrelated
  Dataset:
    name: CIFAR-100
    normalization: cifar100
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params: {size: 32, padding: 4}
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
DFMS:
  lambda_div: 500
  lambda_cls: 0
  temp: 1.0
  divgan_lambda_div: 10
  gan: {nz: 100, ngf: 64, ndf: 64, lr: 0.0002, beta1: 0.5, batch_size: 64}
  epochs: {dcgan: 200, clone_offline: 200, divgan: 100, alternate: 800}
  max_samples: 50000
  mix_ratio: {proxy: 0.5, gan: 0.5}
  offline_batch_size: 128
  val_samples: 20000
  autoaugment: true
  grad_clip: null
Optimizer:
  name: SGD
  params: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005}
Scheduler:
  name: CosineAnnealingLR
  params: {eta_min: 0.0}
Alternate:
  Optimizer:
    name: SGD
    params: {lr: 0.01, momentum: 0.9, weight_decay: 0.0005}
  Scheduler:
    name: WarmupCosineAnnealingLR
    params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 0.0}
