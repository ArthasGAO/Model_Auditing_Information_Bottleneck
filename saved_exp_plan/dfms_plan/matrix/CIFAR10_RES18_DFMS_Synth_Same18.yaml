# ======================================================
# DFMS-HL model extraction  |  tier B1
# Victim:     CIFAR-10 + ResNet-18 (saved_models/vanilla/.../CIFAR-10_ResNet-18_25000_<seed>_1.0)
# Clone:      ResNet-18 (same architecture family)
# Proxy:      50,000 synthetic shape images (grey), no natural data at all
# Budget:     150 alternating epochs x ceil(N_proxy/64) x 64 ~= 7.5M hard-label queries
# Paper ref:  ResNet-18 84.51 / AlexNet 67.03
# Run with:   main_dfms_extraction.py (SEED_START/SEED_END pick attacker seeds)
# ======================================================

Scenario_Name: CIFAR-10_ResNet-18_25000_DFMS_Synth_Same18
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params: {size: 32, padding: 4}
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
Substitute: {Model: ResNet-18}
Proxy:
  type: synthetic
  synthetic: {num_images: 50000, num_shapes: 50, min_size: 5, max_size: 10, canvas: 100, grey: true, seed: 0}
DFMS:
  lambda_div: 500
  lambda_cls: 0
  temp: 1.0
  divgan_lambda_div: 10
  gan: {nz: 100, ngf: 64, ndf: 64, lr: 0.0002, beta1: 0.5, batch_size: 64}
  epochs: {dcgan: 200, clone_offline: 200, divgan: 100, alternate: 150}
  max_samples: 50000
  mix_ratio: {proxy: 0.5, gan: 0.5}
  offline_batch_size: 128
  val_samples: 20000
  autoaugment: true
  grad_clip: null
Optimizer:
  name: SGD
  params: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005}
Scheduler:
  name: CosineAnnealingLR
  params: {eta_min: 0.0}
Alternate:
  Optimizer:
    name: SGD
    params: {lr: 0.01, momentum: 0.9, weight_decay: 0.0005}
  Scheduler:
    name: WarmupCosineAnnealingLR
    params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 0.0}
