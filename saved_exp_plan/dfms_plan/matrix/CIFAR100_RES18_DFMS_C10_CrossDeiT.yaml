# ======================================================
# DFMS-HL model extraction  |  tier C2
# Victim:     CIFAR-100 + ResNet-18 (saved_models/vanilla/.../CIFAR-100_ResNet-18_25000_<seed>_1.0)
# Clone:      DeiT_Plain (different architecture family)
# Proxy:      CIFAR-10 group_B, all 10 classes (25,000 images), as the paper uses CIFAR-10 for its CIFAR-100 victim
# Budget:     400 alternating epochs x ceil(N_proxy/64) x 64 ~= 10.0M hard-label queries
# Paper ref:  ResNet-18 72.83 (victim 78.52)
# Run with:   main_dfms_extraction.py (SEED_START/SEED_END pick attacker seeds)
# NOTE:       DeiT clone is outside the paper; offline recipe = this repo's DeiT knockoff plan,
#             S7 lr = offline lr / 10 by analogy with the CNN schedule. Pilot before trusting.
# NOTE:       no reference run script for a CIFAR-100 victim; lambda_div and the 10M budget
#             come from the paper, mix_ratio and epoch split by analogy with the 40-class script.
# ======================================================

Scenario_Name: CIFAR-100_ResNet-18_25000_DFMS_Cross10_CrossDeiT
Victim:
  Model_Name: CIFAR-100_ResNet-18_25000
  Model: ResNet-18
  Dataset:
    name: CIFAR-100
    normalization: cifar100
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params: {size: 32, padding: 4}
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
Substitute:
  Model: {model_name: deit_tiny_patch16_224, img_size: 32, patch_size: 4, pretrained: false, drop_path_rate: 0.1}
Proxy:
  type: natural
  split: group_B
  class_filter: all
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params: {size: 32, padding: 4}
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
DFMS:
  lambda_div: 100
  lambda_cls: 0
  temp: 1.0
  divgan_lambda_div: 10
  gan: {nz: 100, ngf: 64, ndf: 64, lr: 0.0002, beta1: 0.5, batch_size: 64}
  epochs: {dcgan: 200, clone_offline: 200, divgan: 100, alternate: 400}
  max_samples: 50000
  mix_ratio: {proxy: 1.0, gan: 0.5}
  offline_batch_size: 128
  val_samples: 20000
  autoaugment: true
  grad_clip: 1.0
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.03
Scheduler:
  name: WarmupCosineAnnealingLR
  params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 1.0e-06}
Alternate:
  Optimizer:
    name: AdamW
    params:
      lr: 7.0e-05
      betas: [0.9, 0.999]
      eps: 1.0e-08
      weight_decay: 0.03
  Scheduler:
    name: WarmupCosineAnnealingLR
    params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 1.0e-06}
