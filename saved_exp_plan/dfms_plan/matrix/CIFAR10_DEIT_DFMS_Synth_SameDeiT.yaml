# ======================================================
# DFMS-HL model extraction  |  tier B2
# Victim:     CIFAR-10 + DeiT_Plain (saved_models/vanilla/.../CIFAR-10_DeiT_Plain_25000_<seed>_1.0)
# Clone:      DeiT_Plain (same architecture family)
# Proxy:      50,000 synthetic shape images (grey), no natural data at all
# Budget:     150 alternating epochs x ceil(N_proxy/64) x 64 ~= 7.5M hard-label queries
# Paper ref:  ResNet-18 84.51 / AlexNet 67.03
# Run with:   main_dfms_extraction.py (SEED_START/SEED_END pick attacker seeds)
# NOTE:       DeiT clone is outside the paper; offline recipe = this repo's DeiT knockoff plan,
#             S7 lr = offline lr / 10 by analogy with the CNN schedule. Pilot before trusting.
# ======================================================

Scenario_Name: CIFAR-10_DeiT_Plain_25000_DFMS_Synth_SameDeiT
Victim:
  Model_Name: CIFAR-10_DeiT_Plain_25000
  Model: {model_name: deit_tiny_patch16_224, img_size: 32, patch_size: 4, pretrained: false, drop_path_rate: 0.1}
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomResizedCrop
      params:
        size: 32
        scale: [0.85, 1.0]
        ratio: [0.9, 1.1]
    - name: RandomHorizontalFlip
      params: {p: 0.5}
    - name: RandAugment
      params: {num_ops: 2, magnitude: 7}
    - {name: ToTensor}
    - {name: Normalize}
    - name: RandomErasing
      params:
        p: 0.15
        scale: [0.02, 0.25]
        ratio: [0.3, 3.3]
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000
Substitute:
  Model: {model_name: deit_tiny_patch16_224, img_size: 32, patch_size: 4, pretrained: false, drop_path_rate: 0.1}
Proxy:
  type: synthetic
  synthetic: {num_images: 50000, num_shapes: 50, min_size: 5, max_size: 10, canvas: 100, grey: true, seed: 0}
DFMS:
  lambda_div: 500
  lambda_cls: 0
  temp: 1.0
  divgan_lambda_div: 10
  gan: {nz: 100, ngf: 64, ndf: 64, lr: 0.0002, beta1: 0.5, batch_size: 64}
  epochs: {dcgan: 200, clone_offline: 200, divgan: 100, alternate: 150}
  max_samples: 50000
  mix_ratio: {proxy: 0.5, gan: 0.5}
  offline_batch_size: 128
  val_samples: 20000
  autoaugment: true
  grad_clip: 1.0
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas: [0.9, 0.999]
    eps: 1.0e-08
    weight_decay: 0.03
Scheduler:
  name: WarmupCosineAnnealingLR
  params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 1.0e-06}
Alternate:
  Optimizer:
    name: AdamW
    params:
      lr: 7.0e-05
      betas: [0.9, 0.999]
      eps: 1.0e-08
      weight_decay: 0.03
  Scheduler:
    name: WarmupCosineAnnealingLR
    params: {warmup_epochs: 10, warmup_start_factor: 0.1, eta_min: 1.0e-06}
