# ======================================================================
# CIFAR-10 pruning - source model CIFAR-10_DeiT_Plain_25000
#   checkpoint : saved_models/vanilla/Transformer_Models/CIFAR-10_DeiT_Plain_25000_42_1.0/best_epoch.pth
#   driver     : main_prune_deit
#   sparsity [0.2, 0.8] x FT-AL 30ep lr=0.0001
#
# FT data = the OTHER 25000 CIFAR-10 images, matching the CIFAR-100 row.
# FT_Dataset.name is the dataset's own name, which sends
# util.determine_ft_dataset down its create_or_load_group_B(0.0) branch -
# group_A's disjoint complement. This is NOT the pseudo-labelled ImageNet
# subset the older CIFAR-10 runs used, so _Same_25000 does not collide
# with the _PseudoLabel_25000 models already on disk.
#
# PLAIN DeiT: CIFAR-10's transformer negative pool is DeiT_Plain (CIFAR-100's
# is DeiT_Distill), so the suspect must be that variant to have a null.
# Transforms copy that pool's recipe (RandAugment m7, erase p0.15, dp 0.1).
# Generated by saved_exp_plan/make_c10_ft_prune_plans.py - edit there.
# ======================================================================
Model_Name: CIFAR-10_DeiT_Plain_25000
Scenario_Name: CIFAR-10_DeiT_Plain_25000_Same_25000
Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: &id001
  - name: RandomResizedCrop
    params:
      size: 32
      scale:
      - 0.85
      - 1.0
      ratio:
      - 0.9
      - 1.1
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: RandAugment
    params:
      num_ops: 2
      magnitude: 7
  - name: ToTensor
  - name: Normalize
  - name: RandomErasing
    params:
      p: 0.15
      scale:
      - 0.02
      - 0.25
      ratio:
      - 0.3
      - 3.3
  test_transforms: &id002
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms: *id001
  test_transforms: *id002
  group_size: 25000
  note: same
Model:
  model_name: deit_tiny_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: false
  drop_path_rate: 0.1
Optimizers:
- name: AdamW
  sparsity: 0.2
  params: &id003
    lr: 0.0001
    weight_decay: 0.03
  Epochs: 30
- name: AdamW
  sparsity: 0.8
  params: *id003
  Epochs: 30
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128
