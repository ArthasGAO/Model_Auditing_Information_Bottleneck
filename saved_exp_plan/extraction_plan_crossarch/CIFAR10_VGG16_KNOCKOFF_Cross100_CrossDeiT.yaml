# ======================================================
# Knockoff model extraction - cross-architecture cell
# Victim:     CIFAR-10 + VGG16 (test acc ~91.66%)  (loaded from vanilla/CNN_Models/)
# Substitute: DeiT-tiny  (different architecture family w.r.t. the victim)
# Auxiliary:  CIFAR-100 (cross domain w.r.t. the victim)
# Recipe:     AdamW 7e-4 / warmup cosine / 200 ep (standard DeiT)
# Run with:   main_knockoff_extraction_deit.py, then calculate_MI_extraction_deit.py
#             (that fork handles a DeiT on EITHER side; the CNN-only script
#              cannot build a DeiT at all)
# ======================================================

Scenario_Name: CIFAR-10_VGG16_25000_Knockoff_Cross100_CrossDeiT

Victim:
  Model_Name: CIFAR-10_VGG16_25000
  Model: VGG16
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    # Documents how the victim was trained; extraction only ever touches this
    # dataset's test_set / in_sample_set, both of which use test_transforms.
    train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000

Substitute:
  Model:
    model_name: deit_tiny_patch16_224
    img_size: 32          # CIFAR-native DeiT: 8x8 patches + cls = 65 tokens
    patch_size: 4
    pretrained: False
    drop_path_rate: 0.1

# Attacker's query pool: group B only, disjoint from the victim's group A.
# train_transforms here = the SURROGATE's own augmentation recipe. The query
# runs on clean=True (test_transforms), so the stolen soft labels are identical
# regardless of which augmentation the surrogate trains under.
Auxiliary_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomResizedCrop, params: {size: 32, scale: [0.85, 1.0], ratio: [0.9, 1.1]}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: RandAugment, params: {num_ops: 2, magnitude: 7}}
    - {name: ToTensor}
    - {name: Normalize}
    - {name: RandomErasing, params: {p: 0.15, scale: [0.02, 0.25], ratio: [0.3, 3.3]}}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Knockoff:
  sampling_size: 1.0

# Surrogate recipe = how a DeiT is normally trained (AdamW + warmup cosine).
# Mixup / label smoothing from the vanilla DeiT plan do NOT carry over: they act
# on hard labels, while knockoff optimises KL against the victim's soft labels.
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas: [0.9, 0.999]
    eps: 1.0e-8
    weight_decay: 0.03
    amsgrad: False

Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 10
    warmup_start_factor: 0.1
    T_max: 200
    eta_min: 0.000001

Epochs: 200
BatchSize: 128
