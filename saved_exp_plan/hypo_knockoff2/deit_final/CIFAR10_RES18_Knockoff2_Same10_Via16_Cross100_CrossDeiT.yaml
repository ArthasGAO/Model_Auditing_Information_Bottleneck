# ======================================================================
# Double knockoff extraction -- hop 2 of 2   (GENERATED, do not hand-edit)
#   make_double_plans.py  ->  Via16_Cross100_CrossDeiT
# ======================================================================
# chain    : CIFAR-10 ResNet-18 (victim)  ->  VGG16 (S1)  ->  DeiT-Ti (S2)
# hop 1    : CIFAR-10 group_B   CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16
#            already trained, seeds 0..4, test acc 90.9-91.2%, d = 17.73 p95
# hop 2    : CIFAR-100 group_B -- 25 000 OOD images, disjoint from every CIFAR-10 group
# suspect  : S2, measured against Negative_Model_Pool_0.0/Transformer  (DeiT_Plain, 80)
#
# COMPARE AGAINST, and nothing else:
#   CIFAR-10_ResNet-18_25000_Knockoff_Cross100_CrossDeiT
#   d = 22.19 p95   I(T;Y) = +12.93 p95   (1 seed only, extraction_vanilla/Transformer_Models/)
# That is the 1-hop surrogate of the VICTIM with this cell's query set
# AND architecture, so it differs from this cell only in hop count.
# Comparing a Cross100 cell against a Same10 number instead would show
# two hops 'strengthening' the signal -- the query set alone moves d by
# 2-5x, almost all of it on the I(X;T) axis. Prefer I(T;Y) when reading
# across query sets; it is the inherited-competence axis and is stable.
#
# query    : soft labels, KL objective, clean transforms -- same attack
#            as hop 1; only the queried model (and, in the Cross100
#            arm, the query pool) differ
# recipe   : how a CIFAR-10 DeiT-Ti is normally trained, unchanged
#            from the one-hop plan
# run      : main_knockoff_extraction_double.py   (NOT the one-hop drivers:
#            main_knockoff_extraction.py ignores Model_Dir and would load
#            the ORIGINAL victim from vanilla/, silently redoing hop 1)
# MI       : calculate_MI_extraction.py -- listed in EXTRACTION_BEST_PLANS
# ======================================================================
Scenario_Name: CIFAR-10_ResNet-18_25000_Knockoff2_Same10_Via16_Cross100_CrossDeiT
Chain:
  hop0_victim: CIFAR-10_ResNet-18_25000  (ResNet-18, group_A, seed 42, rate 1.0)
  hop1_surrogate: CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16  (VGG16, queried with CIFAR-10 group_B,
    test acc 90.9-91.2%, d = 17.73 p95)
  hop2_surrogate: CIFAR-10_ResNet-18_25000_Knockoff2_Same10_Via16_Cross100_CrossDeiT  (DeiT-Ti)  <- the
    suspect
  hop2_query_pool: CIFAR-100 group_B -- 25 000 OOD images, disjoint from every CIFAR-10 group
  measured_against: Negative_Model_Pool_0.0/Transformer  (DeiT_Plain, 80)
  compare_with: CIFAR-10_ResNet-18_25000_Knockoff_Cross100_CrossDeiT
  compare_with_d_over_p95: '22.19'
  compare_with_I_T_Y_over_p95: '+12.93'
  compare_with_note: 1 seed only, extraction_vanilla/Transformer_Models/
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000_Knockoff_Same10_Cross16
  Model_Dir: ./saved_models/extraction_final
  Model: VGG16
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    train_transforms:
    - name: RandomCrop
      params:
        size: 32
        padding: 4
    - name: RandomHorizontalFlip
      params:
        p: 0.5
    - name: ToTensor
    - name: Normalize
    test_transforms:
    - name: ToTensor
    - name: Normalize
    group_size: 25000
Substitute:
  Model:
    model_name: deit_tiny_patch16_224
    img_size: 32
    patch_size: 4
    pretrained: false
    drop_path_rate: 0.1
Auxiliary_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomResizedCrop
    params:
      size: 32
      scale:
      - 0.85
      - 1.0
      ratio:
      - 0.9
      - 1.1
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: RandAugment
    params:
      num_ops: 2
      magnitude: 7
  - name: ToTensor
  - name: Normalize
  - name: RandomErasing
    params:
      p: 0.15
      scale:
      - 0.02
      - 0.25
      ratio:
      - 0.3
      - 3.3
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Knockoff:
  sampling_size: 1.0
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.03
    amsgrad: false
Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 10
    warmup_start_factor: 0.1
    T_max: 200
    eta_min: 1.0e-06
Epochs: 200
BatchSize: 128
