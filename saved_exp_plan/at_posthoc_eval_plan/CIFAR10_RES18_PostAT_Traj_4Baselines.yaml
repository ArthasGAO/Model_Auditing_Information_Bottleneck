#
# negatives   the 80 rate-0.0 ResNet-18 models that are ALREADY the null of the MI method.
#             Running the baselines on them puts every threshold on one negative population,
#             so the four baselines and the MI distance are answerable against the same set.
#             This matters: the cached DeepJudge RobD threshold (tau 0.2578) was fitted to a
#             BIMODAL pool of 10 overlap-0.0 + 9 overlap-1.0 models, and its t-based lower
#             bound lands inside the overlap-1.0 cluster -- 8 of its own 19 negatives fall
#             below it, a 42% false-positive rate on the set that defined it.
# ======================================================================
Victim:
  Model_Name: CIFAR-10_ResNet-18_25000
  Model: ResNet-18
  Seed: 42
  Overlap: 1.0
  Dataset:
    name: CIFAR-10
    normalization: cifar10
    img_size: 32
    group_size: 25000
    download: false
Methods:
- Utility
- IPGuard
- DeepJudge
- DI
- ADV_TRA
Baselines:
  IPGuard:
    k: 5
    Size: 100
    Decision: TR
    Negative_Master: saved_logs/at_eval/IPGuard/master.csv
  DeepJudge:
    Attack:
      name: PGD
      eps: 0.03
      steps: 10
      step_size: 0.003
    Batch_Size: 256
  ADV_TRA:
    Fingerprint_Root: CIFAR-10_ResNet-18_25000_42_1.0
    Threshold: 0.5
  DI:
    N_Train_Samples: 1000
    N_Test_Samples: 1000
    Alpha: 0.05
Case_Sets:
  sources:
    Stage: source
    Model: ResNet-18
    Checkpoint: best_epoch.pth
