# ======================================================================
# CIFAR-100 pruning - source model CIFAR-100_VGG16_25000
#   checkpoint : saved_models/vanilla/CNN_Models/CIFAR-100_VGG16_25000_42_1.0/best_epoch.pth
#   driver     : main_prune
#   sparsity [0.2, 0.8] x FT-AL 50ep lr=0.0001
#
# FT data = the OTHER 25000 CIFAR-100 images. FT_Dataset.name is the
# dataset's own name, which sends util.determine_ft_dataset down its
# create_or_load_group_B(overlap_rate=0.0) branch - group_A's disjoint
# complement. `note: same` is documentation; the branch keys off the name.
# Generated by saved_exp_plan/make_c100_ft_prune_plans.py - edit there.
# ======================================================================
Model_Name: CIFAR-100_VGG16_25000
Scenario_Name: CIFAR-100_VGG16_25000_Same_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms: &id001
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms: &id002
  - name: ToTensor
  - name: Normalize
  group_size: 25000
FT_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms: *id001
  test_transforms: *id002
  group_size: 25000
  note: same
Model: VGG16
Optimizers:
- name: SGD
  sparsity: 0.2
  params: &id003
    lr: 0.0001
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
  Epochs: 50
- name: SGD
  sparsity: 0.8
  params: *id003
  Epochs: 50
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
BatchSize: 128
