# ======================================================================
# KD positive cell - CIFAR-100
#   Teacher / victim : ResNet-34  (cross-family)
#   Student /suspect : DEIT       -> negative pool CIFAR-100_DeiT_Distill_25000 rate 0.0 (260 ep)
#
#   teacher_ckpt     : ./saved_models/vanilla/CIFAR-100_ResNet-34_25000_42_1.0/best_epoch.pth
#                      (train it with main_train_teacher.py, rate 1.0)
#
# Student recipe is copied from that student's own pool so the positive
# and its null differ only by the teacher term.
#   distilled backbone, matching the only C100 transformer pool. timm's distilled_training stays False, so the model emits one averaged (head + head_dist)/2 tensor and KD/DKD train both heads.
#
# Methods: KD and DKD. FitNet is omitted - see make_kd_plans.py.
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py - edit there.
# ======================================================================
Scenario_Name: CIFAR-100_ResNet-34toDeiT_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomResizedCrop
    params:
      size: 32
      scale:
      - 0.85
      - 1.0
      ratio:
      - 0.9
      - 1.1
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: RandAugment
    params:
      num_ops: 2
      magnitude: 9
  - name: ToTensor
  - name: Normalize
  - name: RandomErasing
    params:
      p: 0.2
      scale:
      - 0.02
      - 0.2
      ratio:
      - 0.3
      - 3.3
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Teacher_Model:
  teacher_name: ResNet-34
  teacher_ckpt: ./saved_models/vanilla/CIFAR-100_ResNet-34_25000_42_1.0/best_epoch.pth
Student_Model:
  student_name: DeiT
  model_name: deit_tiny_distilled_patch16_224
  img_size: 32
  patch_size: 4
  pretrained: false
  drop_path_rate: 0.15
Augmentation:
  use_mixup: false
  label_smoothing: 0.15
Optimizer:
  name: AdamW
  params:
    lr: 0.0007
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.05
    amsgrad: false
Distillation:
- name: KD
  params:
    TEMPERATURE: 4
    CE_WEIGHT: 0.1
    KD_WEIGHT: 0.9
- name: DKD
  params:
    CE_WEIGHT: 1.0
    ALPHA: 1.0
    BETA: 8.0
    T: 4.0
    WARMUP: 20
Scheduler:
  name: WarmupCosineAnnealingLR
  params:
    warmup_epochs: 15
    warmup_start_factor: 0.1
    T_max: auto
    eta_min: 1.0e-06
Epochs: 260
BatchSize: 128
