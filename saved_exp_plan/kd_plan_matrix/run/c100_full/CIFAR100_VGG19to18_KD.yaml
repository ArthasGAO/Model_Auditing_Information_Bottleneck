# ======================================================================
# KD positive cell - CIFAR-100
#   Teacher / victim : VGG19      (cross-family)
#   Student /suspect : RES18      -> negative pool CIFAR-100_ResNet-18_25000 rate 0.0 (360 ep, wd 1e-3)
#
#   teacher_ckpt     : ./saved_models/vanilla/CIFAR-100_VGG19_25000_42_1.0/best_epoch.pth
#                      (train it with main_train_teacher.py, rate 1.0)
#
# Student recipe is copied from that student's own pool so the positive
# and its null differ only by the teacher term.
#   matches the pool exactly. NOTE the weight decay is 1e-3 here, not the 5e-4 used everywhere on CIFAR-10.
#
# Methods: KD and DKD. FitNet is omitted - see make_kd_plans.py.
# Generated by saved_exp_plan/kd_plan_matrix/make_kd_plans.py - edit there.
# ======================================================================
Scenario_Name: CIFAR-100_VGG19to18_25000
Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
  - name: RandomCrop
    params:
      size: 32
      padding: 4
  - name: RandomHorizontalFlip
    params:
      p: 0.5
  - name: ToTensor
  - name: Normalize
  test_transforms:
  - name: ToTensor
  - name: Normalize
  group_size: 25000
Teacher_Model:
  teacher_name: VGG19
  teacher_ckpt: ./saved_models/vanilla/CIFAR-100_VGG19_25000_42_1.0/best_epoch.pth
Student_Model:
  student_name: ResNet-18
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.001
Distillation:
- name: KD
  params:
    TEMPERATURE: 4
    CE_WEIGHT: 0.1
    KD_WEIGHT: 0.9
- name: DKD
  params:
    CE_WEIGHT: 1.0
    ALPHA: 1.0
    BETA: 8.0
    T: 4.0
    WARMUP: 20
Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06
Epochs: 360
BatchSize: 128
