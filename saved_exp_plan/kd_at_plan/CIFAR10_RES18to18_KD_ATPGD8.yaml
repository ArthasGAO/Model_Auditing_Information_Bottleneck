# ======================================================
# Same-architecture KD WITH an added adversarial term (one-stage AT; driver: main_kd_at.py).
#   Teacher: the CIFAR-10 ResNet-18 VICTIM (group_A, 25000, seed 42), i.e. the same model the
#            FT and knockoff families derive from
#   Student: ResNet-18 trained from scratch on the transfer set group_B
#            (overlap rate r from the command line; 0.0 = Cell C, disjoint transfer set)
# Everything above the AdversarialTraining block is a copy of
# saved_exp_plan/kd_plan_matrix/run/c10_self/CIFAR10_RES18to18_KD.yaml with the DKD entry
# removed (main_kd_at.py implements the KD method only). The no-AT reference is
# saved_models/kd_final/CIFAR-10_ResNet-18to18_25000_KD_<seed>_0.0 (seed 0: 93.36%).
#
# Per batch:  L = L_kd(f_s(x), f_t(x), y) + lambda * L_kd(f_s(x_adv), f_t(x), y),  lambda = 1,
#             L_kd = 0.1 * CE + 0.9 * T^2 * KL(student/T || teacher/T), T = 4; teacher sees clean x only.
# ======================================================
Scenario_Name: CIFAR-10_ResNet-18to18_25000

Dataset:
  name: CIFAR-10
  normalization: cifar10
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Teacher_Model:
  teacher_name: ResNet-18
  teacher_ckpt: "./saved_models/vanilla/CNN_Models/CIFAR-10_ResNet-18_25000_42_1.0/best_epoch.pth"

Student_Model:
  student_name: ResNet-18

Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005

Distillation:
  - name: KD
    params:
      TEMPERATURE: 4
      CE_WEIGHT: 0.1
      KD_WEIGHT: 0.9

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: auto
    eta_min: 1.0e-06

Epochs: 200
BatchSize: 128     # not read: main_kd.py and main_kd_at.py use batch 256

# ---- Added adversarial term (new) ----
AdversarialTraining:
  form: additive     # L = L_kd(x) + lambda * L_kd(x_adv); weights used as given
  lambda: 1.0
  # both: from-scratch student, nothing to freeze; both loss forwards in train mode, BN updated
  # by both. Validate every model with diagnose_bn_modes.py --arch resnet18_dist before use.
  bn_policy: both

# Same grid semantics as main_at.py; select a subset at run time with --eps.
Attack:
  name: PGD
  eps: [0.007843, 0.015686, 0.031373]   # 2/255, 4/255, 8/255
  steps: 10
