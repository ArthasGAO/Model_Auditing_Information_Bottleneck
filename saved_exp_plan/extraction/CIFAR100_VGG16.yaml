Scenario_Name: CIFAR-100_VGG16_25000_Knockoff_Same100_Same16
Victim_Scenario: CIFAR-100_VGG16_25000           # saved_models/victim/<Victim_Scenario>_42_1.0/best_epoch.pth

Victim:
  Model: VGG16                                   # the victim's architecture
  Dataset: &victim_data                          # how the victim was trained (defines group_A and the MI probe set)
    name: CIFAR-100
    root_dir: ./data
    normalization: cifar100
    img_size: 32
    train_transforms:
      - {name: RandomCrop, params: {size: 32, padding: 4}}
      - {name: RandomHorizontalFlip, params: {p: 0.5}}
      - {name: ToTensor}
      - {name: Normalize}
    test_transforms:
      - {name: ToTensor}
      - {name: Normalize}
    group_size: 25000

Substitute:
  Model: VGG16                                   # the suspect's architecture

Auxiliary_Dataset: *victim_data                  # query set = group_B of this dataset

Optimizer:
  name: SGD
  params: {lr: 0.1, momentum: 0.9, weight_decay: 0.0005, nesterov: true}

Scheduler:
  name: CosineAnnealingLR
  params: {T_max: auto, eta_min: 1.0e-06}     # auto -> Epochs

Epochs: 400
