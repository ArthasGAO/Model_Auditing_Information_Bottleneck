# ======================================================
# Knockoff model extraction -- CIFAR-100, Same100 3x3 matrix
# Victim:     VGG16 (VGG16, SGD/cosine/400ep, saved_models/vanilla/CNN_Models/)
# Substitute: VGG16 -- SGD 0.1 / cosine / 400 ep (CIFAR-100_VGG16_25000's own recipe)
# Auxiliary:  CIFAR-100 group_B (same distribution as the victim, disjoint
#             from its group_A), 25000 samples, sampling_size 1.0
# Run with:   main_knockoff_extraction.py
# ======================================================

Scenario_Name: CIFAR-100_VGG16_25000_Knockoff_Same100_Same16

Victim:
  Model_Name: CIFAR-100_VGG16_25000   # folder under saved_models/vanilla/CNN_Models/
  Model: VGG16
  Dataset:
    name: CIFAR-100
    normalization: cifar100
    img_size: 32
    # Documents how the victim was trained; the attack only ever reads this
    # dataset's test_set / in_sample_set, both of which are clean.
    train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
    test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
    group_size: 25000

Substitute:
  Model: VGG16

# Attacker's query pool: group_B only, disjoint from the victim's group_A.
# train_transforms here are the SURROGATE's training augmentation; the query
# itself uses test_transforms, so the stolen soft labels are identical across
# all nine cells of the matrix.
Auxiliary_Dataset:
  name: CIFAR-100
  normalization: cifar100
  img_size: 32
  train_transforms:
    - {name: RandomCrop, params: {size: 32, padding: 4}}
    - {name: RandomHorizontalFlip, params: {p: 0.5}}
    - {name: ToTensor}
    - {name: Normalize}
  test_transforms:
    - {name: ToTensor}
    - {name: Normalize}
  group_size: 25000

Knockoff:
  sampling_size: 1.0

# Surrogate recipe = how this architecture is normally trained on CIFAR-100.
Optimizer:
  name: SGD
  params:
    lr: 0.1
    momentum: 0.9
    nesterov: true
    weight_decay: 0.0005

Scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 400       # literal, NOT "auto": the knockoff scripts pass params straight through
    eta_min: 0.000001

Epochs: 400
BatchSize: 128
